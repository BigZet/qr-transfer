[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-transfer"
version = "0.6.1"
description = "Offline visual transfer protocol and deterministic test bench"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fec = ["lt-code==0.3"]
qr = ["qrcode>=7.4,<9", "Pillow>=10,<13", "zxing-cpp==3.1.1"]
container = ["py7zr==1.1.3"]
sender = ["py7zr==1.1.3", "segno==1.6.6"]
receiver = ["numpy>=1.24,<3", "py7zr==1.1.3", "mss==10.2.0", "psutil>=5.9,<8", "Pillow>=10,<13", "zxing-cpp==3.1.1"]

[project.scripts]
qr-transfer = "qr_transfer.cli:main"

[tool.setuptools.packages.find]
include = ["qr_transfer*"]

[tool.setuptools.package-data]
qr_transfer = ["assets/*.html", "assets/*.js"]
